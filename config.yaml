# Canonical non-sensitive configuration: the single source of truth for
# infrastructure knobs (models, paths, retrieval, chunking, seed).
#
# Secrets and endpoints live in .env only; this file is committed to GitHub.
# The evaluated method's own numbers (mastery thresholds, delta clamp) are in
# src/agent/policy.py and are NOT duplicated here - two copies of the same
# number is how the product and the experiment drifted apart before.
# Every run stamps config_for_log() into its result metadata, so changing a
# value below makes new results incomparable with the frozen ones.

platform:
  version: "0.3.0"        # recorded in every run's metadata

llm:
  # OpenRouter model id. Pinned to a dated snapshot on purpose: a floating
  # alias can be repointed to new weights between a run and its replay, which
  # silently breaks a frozen experiment.
  # Paid on purpose - the free tier hit 429 daily limits and returned replies
  # truncated or as prose instead of JSON (~$0.0002 per decision).
  model: deepseek/deepseek-v4.1-flash-1017

  # Tried in order when the primary is unusable (retired id / 429 / network).
  # A different vendor on purpose: if DeepSeek is down, another DeepSeek id
  # goes down with it.
  fallback_models:
    - z-ai/glm-5.3-flash

  # Variable NAMES only - the values are in .env.
  api_key_env: OPENROUTER_API_KEY
  base_url_env: OPENROUTER_BASE_URL
  default_base_url: https://openrouter.ai/api/v1

  temperature: 0.0        # 0 = same input, same output
  max_tokens: 700         # one explanation + one structured question
  timeout_s: 30           # per request
  max_retries: 3          # retry with backoff on 429 / timeout / connection errors

# Deterministic signed-hashing bag-of-words embedder: no API key, no model
# download, no GPU. 256 dimensions is enough for a course-sized corpus.
embedding:
  backend: hashing
  hashing_dimension: 256

paths:
  course_materials: ./data/course_materials   # indexed by src/ingestion/indexer.py
  chroma_persist_dir: ./data/chroma_db        # vector store for both indexes
  sqlite_path: ./data/student_state.db        # learner state (topics / rolls / steps)
  uploads_dir: ./data/uploads                 # raw files uploaded from the UI

# Chunking and retrieval for the RAG indexes (one per source type).
retrieval:
  collection_name: course_chunks      # course material
  upload_collection: student_uploads  # user uploads
  chunk_size: 800                     # characters per chunk
  chunk_overlap: 100                  # keeps sentences that straddle a boundary
  top_k: 3                            # excerpts fed to one answer

# ---------------------------------------------------------------------------
# The evaluated method's numbers are NOT here.
#
# The adaptive policy lives in code: src/agent/policy.py (POLICY_ID =
# "adaptive-v1", MASTERED = 80, EXPLAIN_CAP = 55, PRACTICE_GAIN = 0.6,
# delta clamp [-10, +25], 0-100 scale). A second copy in YAML is exactly how
# the product and the experiment drifted apart before.
# ---------------------------------------------------------------------------

# Who picks the next activity (src/agent/planner_llm.py).
agent:
  # "llm"  -> the model chooses among the legal candidates and writes the reason
  # "rule" -> policy.decide() only; a demo/test switch, never the default
  # With no API key, "llm" does NOT degrade to "rule": the response reports
  # decided_by=unavailable and ships no step, because a rule-made step would
  # misrepresent the agent.
  planner: "llm"
  planner_model: null          # cheaper model for the decision step; null = llm.model
  planner_max_tokens: 700      # one JSON object; thinking models still need room
  planner_retries: 1           # same model, one retry with the parse error fed back
  planner_max_candidates: 30   # 8 topics x 3 activities = 24, so this never bites
  planner_cache: true          # identical state -> identical decision on rerun

  # Re-ask here when the reply is unusable (truncated reasoning, prose instead
  # of JSON, a topic that is not in the list). The transport only switches
  # models on 429/404/network, so a 200 with a bad body would otherwise lose
  # the decision. Still a model decision - it just asks a stronger model.
  #   null -> reuse llm.fallback_models; [] -> disable
  planner_escalation_models: null
  planner_escalation_max_tokens: 1200   # larger budget; truncation is a common cause
  planner_escalation_retries: 1         # one error-feedback retry on that model
  # How many times the whole chain [primary, *escalation_models] may be
  # re-asked: agent.planner_rounds, default 2 (left implicit because the
  # default is the value we want). Repeating the identical prompt recovers a
  # pass lost to truncated reasoning; worst case is rounds x len(chain) x
  # (retries + 1) calls, so keep the number small.

evaluation:
  subjective_rubric_enabled: false   # recorded in metadata; grading is deterministic

experiment:
  seed: 42                # every experiment and the decision bank use this seed
