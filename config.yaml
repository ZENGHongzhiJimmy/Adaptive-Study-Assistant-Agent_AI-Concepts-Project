# Adaptive Study Assistant Agent - canonical non-sensitive configuration.
#
# This file is the SINGLE source of truth for infrastructure knobs (models,
# paths, retrieval, chunking, seeds). It is NOT the source of truth for the
# evaluated method: the adaptive policy's constants live in
# src/agent/policy.py and are deliberately not duplicated here. See the
# BASELINE block below.
# Secrets / endpoints are the only things allowed in .env (see .env.example).
# NEVER put a real API key here: this file is committed to GitHub.
# Experiment freeze: do not modify this file; every run logs
# config_for_log() (version, model, alpha, thresholds, seed) into events.

platform:
  version: "0.2.0"

llm:
  # Primary model (OpenRouter id). Change this to switch models.
  #
  # PAID model on purpose. The free tier was the main source of two problems:
  # 429 throttling (50 req/day) and replies that came back truncated or as
  # prose instead of JSON. Cost is ~$0.0002 per decision at 2.5k prompt tokens.
  #
  # PINNED SNAPSHOT, not the floating alias. `deepseek/deepseek-v4.1-flash`
  # currently resolves to the 20260910 snapshot; the dated id below is the
  # 20261017 one. Two reasons to pin:
  #   * a frozen experiment must not change weights because a vendor repointed
  #     an alias between the banking run and the replay;
  #   * its cheapest live endpoints are cheaper on both sides of the bill.
  # Measured 2026-11-16 on /api/v1/models/{id}/endpoints (USD per token):
  #   alias  : 36 endpoints, cheapest 5.07e-8 prompt / 2.03e-7 completion
  #   -1017  : 49 endpoints, cheapest 3.00e-8 prompt / 1.00e-7 completion
  # The median endpoint is 3.0e-7 / 1.2e-6 for BOTH, so the saving is cents at
  # this scale (~1.2M tokens for a full 8-seed decision bank); pinning is the
  # real reason, price is a tie-breaker.
  model: deepseek/deepseek-v4.1-flash-1017

  # Fallback models tried in order when the primary model is unavailable
  # (retired id / 429 / network). A DIFFERENT vendor on purpose: if DeepSeek's
  # endpoint is down, another DeepSeek id would be down with it.
  # Measured on the same 22-topic state: 3.6-4.5 s, JSON-clean.
  fallback_models:
    - z-ai/glm-5.3-flash

  # Key / endpoint env var names (values live in .env, never here).
  api_key_env: OPENROUTER_API_KEY
  base_url_env: OPENROUTER_BASE_URL
  default_base_url: https://openrouter.ai/api/v1
  temperature: 0.0              # deterministic content generation for P6
  max_tokens: 700               # grounded Teach + one structured question
  timeout_s: 30
  max_retries: 3

embedding:
  backend: hashing
  hashing_dimension: 256

paths:
  course_materials: ./data/course_materials
  chroma_persist_dir: ./data/chroma_db
  sqlite_path: ./data/student_state.db
  uploads_dir: ./data/uploads

# P1 RAG indexing / retrieval.
retrieval:
  collection_name: course_chunks
  upload_collection: student_uploads
  chunk_size: 800
  chunk_overlap: 100
  top_k: 3

# ---------------------------------------------------------------------------
# BASELINE configuration - NOT the method under evaluation.
#
# The adaptive policy being evaluated lives in CODE: src/agent/policy.py
# (POLICY_ID = "adaptive-v1", MASTERED = 80, EXPLAIN_CAP = 55,
#  PRACTICE_GAIN = 0.6, delta clamp [-10, +25], 0-100 scale).
# Do NOT mirror those numbers here - a second copy in YAML is exactly how the
# product and the experiment drifted apart before.
#
# The two blocks below serve the CLI baseline only:
#   mastery -> src/student_model/mastery.py  (0-1 scale, alpha*old + ...)
#   planner -> src/agent/planner.py          (fixed threshold planner, 0-1)
# They are read by src/agent/graph.py (python -m src.agent.run). Nothing under
# src/api/ or src/agent/serve.py may read them - guarded by
# tests/test_p9_single_method.py so the two scales can never sneak back in.
# ---------------------------------------------------------------------------

# CLI baseline student state model: new = alpha*old + (1-alpha)*performance.
# 0-1 scale; the method uses an integer percentage instead.
mastery:
  alpha: 0.7
  initial: 0.0
  recent_errors_window: 3

# CLI baseline threshold planner: Teach / MCQ / Challenge / Review / Done.
# Thresholds and target are 0-1 (the method's are 0-100 percentages), so these
# numbers are NOT comparable with policy.MASTERED. Fixed for the CLI baseline;
# `target_mastery` stays at 0.85 even though the baseline estimator saturates
# below it - that saturation is a reported finding, not a knob to tune after
# the fact.
planner:
  mode: rule                 # only "rule" is implemented; kept for config_for_log
  thresholds:
    teach_below: 0.4
    practice_below: 0.7
    challenge_below: 0.85
  target_mastery: 0.85
  review_trigger_errors: 2
  max_steps: 10              # hard stop for the State Update -> Re-planning back-edge

# P4 LLM content generation + P5 LLM decision module.
agent:
  # Quote the mode: YAML 1.1 would otherwise parse `off` / `on` as booleans.
  llm_mode: "on"
  max_json_retries: 2        # retry structured question generation on bad JSON
  teach_max_chars: 900       # cap the LLM explanation stored in the trace
  grounded_min_hits: 1       # Teach needs >=1 retrieved chunk for a citation

  # P5: who picks the next activity (src/agent/planner_llm.py).
  #   "llm"  -> the model chooses among the legal candidates and writes the reason
  #   "rule" -> policy.decide() only; an explicit demo/test mode, never automatic
  # Thresholds stay in policy.py and mastery measurement never leaves code, so
  # the experiments still measure the same thing.  If no API key is configured,
  # "llm" does NOT degrade to "rule": the response says decided_by=unavailable
  # and ships no next step, because a rule-made step would misrepresent the
  # agent.  Failed calls / unusable JSON are handled the same way.
  planner: "llm"
  planner_model: null          # optional cheaper model for the decision step
  planner_max_tokens: 700      # one JSON object, never a paragraph (thinking models need room)
  planner_retries: 1           # ask again once if the reply was unusable
  planner_max_candidates: 30   # 8 topics x 3 activities = 24, so this never bites
  planner_cache: true          # identical state -> identical decision on rerun

  # Escalation when the free model answers with something unusable (truncated
  # reasoning, prose instead of JSON, a topic that is not in the list).  The
  # transport layer only switches models on 429/404/network errors, so a 200
  # response with a bad body would otherwise lose the decision entirely.
  # This is still a MODEL decision - it just asks a stronger model.
  #   null -> reuse llm.fallback_models (the paid one); [] -> disable
  planner_escalation_models: null
  planner_escalation_max_tokens: 1200   # truncation is a common cause; give room
  planner_escalation_retries: 1         # one error-feedback retry on the strong model

evaluation:
  subjective_rubric_enabled: false

experiment:
  seed: 42
